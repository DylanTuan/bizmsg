# 本地仅保留 Nacos 地址与配置导入声明，端口/落盘目录等统一维护在 nacos/config/message-service.yml
spring:
  application:
    name: message-service
  config:
    import:
      - optional:nacos:bizmsg-common.yml
      - optional:nacos:message-service.yml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: bizmsg
      config:
        namespace: bizmsg
